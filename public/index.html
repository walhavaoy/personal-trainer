<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal Trainer</title>
    <link rel="stylesheet" href="/css/pt.css" />
  </head>
  <body>
    <header>
      <h1>Personal Trainer</h1>
      <div id="who" data-testid="pt-text-who">…</div>
    </header>
    <main>
      <section id="welcome">
        <h2>Welcome, <span id="firstName">athlete</span>.</h2>
        <div id="summary" data-testid="pt-card-summary" hidden>
          <div class="summary-row">
            <span class="summary-label">This week</span>
            <span class="summary-value">
              <strong id="summary-minutes">0</strong> / <span id="summary-target">0</span> min
              · <span id="summary-sessions">0</span> session(s)
            </span>
          </div>
          <div class="progress"><div id="summary-bar" class="progress-bar"></div></div>
          <div class="summary-row">
            <span class="summary-label">Streak</span>
            <span class="summary-value">
              <span id="summary-streak" class="chip">0 day(s)</span>
              <span id="summary-last" class="muted"></span>
            </span>
          </div>
          <div class="summary-row">
            <span class="summary-label">vs last week</span>
            <span class="summary-value">
              <span id="summary-trend" class="chip">—</span>
              <span id="summary-last-week" class="muted"></span>
            </span>
          </div>
          <div id="summary-coach" data-testid="pt-text-coach" class="coach-message"></div>
        </div>
      </section>

      <section id="today">
        <h3>Today's session</h3>
        <div id="session-loading" class="placeholder">Loading…</div>
        <div id="session" hidden>
          <div class="session-meta">
            <span id="session-day"></span> · <span id="session-theme"></span> · <span id="session-total"></span> min
          </div>
          <div id="trainer-note" data-testid="pt-text-trainernote" class="trainer-note"></div>
          <ol id="session-blocks"></ol>
          <form id="log-form" data-testid="pt-form-log">
            <label>
              Minutes completed
              <input type="number" name="completedMinutes" min="0" max="1000" step="1" data-testid="pt-input-completed" />
            </label>
            <label>
              Notes (optional)
              <input type="text" name="notes" maxlength="500" data-testid="pt-input-notes" placeholder="How did it feel?" />
            </label>
            <button type="submit" data-testid="pt-button-log">Mark done</button>
            <span id="log-status" class="muted"></span>
          </form>
        </div>
      </section>

      <section id="history">
        <h3>Recent workouts</h3>
        <div id="history-loading" class="placeholder">Loading…</div>
        <ul id="history-list" data-testid="pt-list-history" hidden></ul>
        <p id="history-empty" class="muted" hidden>No workouts logged yet. Complete today's session to start your history.</p>
      </section>

      <section id="profile">
        <h3>Your profile</h3>
        <form id="profile-form" data-testid="pt-form-profile">
          <label>
            Goal
            <select name="goal" data-testid="pt-select-goal">
              <option value="general_fitness">General fitness</option>
              <option value="strength">Strength</option>
              <option value="endurance">Endurance</option>
              <option value="weight_loss">Weight loss</option>
              <option value="mobility">Mobility</option>
            </select>
          </label>
          <label>
            Fitness level
            <select name="fitnessLevel" data-testid="pt-select-level">
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="advanced">Advanced</option>
            </select>
          </label>
          <label>
            Weekly target minutes
            <input type="number" name="weeklyMinutes" min="0" max="1500" step="15" data-testid="pt-input-weekly" />
          </label>
          <button type="submit" data-testid="pt-button-save">Save</button>
          <span id="profile-status" class="muted"></span>
        </form>
      </section>
    </main>
    <script src="/js/pt.js"></script>
  </body>
</html>
