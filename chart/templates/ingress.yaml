{{- $ns := .Values.deployNamespace | default .Release.Namespace -}}
{{- if .Values.ingress.enabled }}
# Private app: every page needs the user identity, so we route the whole host
# through the Keycloak forward-auth middleware. /healthz and /readyz are probed
# in-cluster (kubelet hits the pod IP directly) so they bypass this entirely.
#
# The forward-auth + strip-forwarded-user middlewares live in the
# {{ .Values.ingress.authMiddlewareNamespace }} namespace and are provisioned
# separately (they're shared infra, not pt-specific).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pt-authed
  namespace: {{ $ns }}
  labels:
    app: pt
spec:
  entryPoints: [web, websecure]
  tls:
    certResolver: {{ .Values.ingress.certResolver }}
    domains:
      - main: {{ .Values.ingress.host }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingress.host }}`)
      priority: 100
      middlewares:
        - name: strip-forwarded-user
          namespace: {{ .Values.ingress.authMiddlewareNamespace }}
        - name: forward-auth
          namespace: {{ .Values.ingress.authMiddlewareNamespace }}
      services:
        - name: pt
          port: 8080
{{- end }}
